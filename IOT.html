<!-- <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#05080d">
<title>EcoGuardian AI — RFID Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#07090d;
  --surface:#0d1118;
  --surface2:#111722;
  --surface3:#161d29;
  --edge:#293545;
  --edge2:#3c4e63;
  --text:#eef7ff;
  --muted:#71849a;
  --cyan:#39c7ff;
  --cyan2:#8be8ff;
  --green:#35e6a1;
  --red:#ff4d6d;
  --amber:#ffc857;
  --violet:#a78bfa;
  --black:#020306;
  --radius:18px;
  --hard:6px 6px 0 #020306;
  --soft:inset 5px 5px 12px rgba(0,0,0,.55),inset -5px -5px 12px rgba(255,255,255,.025),0 18px 45px rgba(0,0,0,.35);
}

*{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}

body{
  min-height:100vh;
  color:var(--text);
  font-family:Inter,system-ui,sans-serif;
  background:
    radial-gradient(700px 420px at 12% -5%,rgba(57,199,255,.13),transparent 65%),
    radial-gradient(650px 430px at 92% 15%,rgba(167,139,250,.10),transparent 64%),
    radial-gradient(700px 500px at 45% 105%,rgba(53,230,161,.065),transparent 68%),
    #07090d;
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-2;
  opacity:.5;
  background:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:34px 34px;
  mask-image:linear-gradient(to bottom,#000,transparent 92%);
}

body:after{
  content:"";
  position:fixed;
  width:48vw;
  height:48vw;
  max-width:760px;
  max-height:760px;
  left:50%;
  top:35%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  border:1px solid rgba(57,199,255,.045);
  box-shadow:
    0 0 0 60px rgba(57,199,255,.018),
    0 0 0 120px rgba(167,139,250,.012),
    0 0 100px rgba(57,199,255,.035);
  pointer-events:none;
  z-index:-1;
  animation:orb 9s ease-in-out infinite;
}

@keyframes orb{
  0%,100%{transform:translate(-50%,-50%) scale(.96)}
  50%{transform:translate(-50%,-50%) scale(1.04)}
}

@keyframes scan{
  from{transform:translateY(-20vh)}
  to{transform:translateY(120vh)}
}

.shell{
  width:min(1480px,calc(100% - 36px));
  margin:auto;
  padding:20px 0 45px;
}

.topbar{
  min-height:82px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  padding:0 4px 18px;
  margin-bottom:18px;
  border-bottom:1px solid rgba(139,232,255,.12);
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.brand-mark{
  width:54px;
  height:54px;
  display:grid;
  place-items:center;
  border-radius:15px;
  color:var(--cyan2);
  font-size:25px;
  background:
    linear-gradient(145deg,#1b2634,#0a0e14);
  border:1px solid var(--edge2);
  box-shadow:
    var(--soft),
    0 0 35px rgba(57,199,255,.08);
  position:relative;
}

.brand-mark:before{
  content:"";
  position:absolute;
  inset:7px;
  border:1px solid rgba(139,232,255,.18);
  border-radius:10px;
}

.brand h1{
  font-size:19px;
  letter-spacing:.13em;
  font-weight:900;
}

.brand h1 span{
  color:var(--cyan);
}

.brand p{
  margin-top:5px;
  color:#5f7489;
  font:9px "Space Mono",monospace;
  letter-spacing:.2em;
}

.top-actions{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:8px;
  flex-wrap:wrap;
}

.pill{
  height:35px;
  padding:0 12px;
  display:flex;
  align-items:center;
  gap:8px;
  border:1px solid var(--edge);
  border-radius:999px;
  background:
    linear-gradient(145deg,#151d28,#090d13);
  box-shadow:
    inset 2px 2px 5px rgba(255,255,255,.025),
    inset -3px -3px 7px rgba(0,0,0,.55);
  color:#8296aa;
  font:8px "Space Mono",monospace;
  letter-spacing:.09em;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--red);
  box-shadow:0 0 10px rgba(255,77,109,.55);
}

.dot.live{
  background:var(--green);
  box-shadow:0 0 14px rgba(53,230,161,.85);
  animation:pulse 1.7s infinite;
}

@keyframes pulse{
  50%{opacity:.35;transform:scale(.72)}
}

.commandbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:11px 14px;
  margin-bottom:16px;
  border:1px solid var(--edge);
  border-radius:11px;
  background:#0b1017;
  box-shadow:var(--hard);
  position:relative;
  overflow:hidden;
}

.commandbar:before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent);
  opacity:.45;
}

.breadcrumb{
  color:#667a8f;
  font:8px "Space Mono",monospace;
  letter-spacing:.12em;
}

.breadcrumb b{
  color:var(--cyan2);
}

.clock{
  color:#b4c6d6;
  font:10px "Space Mono",monospace;
}

.hero{
  display:grid;
  grid-template-columns:minmax(0,1.42fr) minmax(290px,.58fr);
  gap:14px;
  margin-bottom:15px;
}

.hero-main,
.hero-side{
  position:relative;
  overflow:hidden;
  border:1px solid var(--edge);
  background:
    linear-gradient(145deg,rgba(20,28,39,.97),rgba(7,10,15,.98));
  box-shadow:var(--soft);
}

.hero-main{
  min-height:285px;
  padding:31px;
  border-radius:24px 8px 24px 8px;
}

.hero-main:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(120deg,rgba(57,199,255,.08),transparent 35%),
    repeating-linear-gradient(
      90deg,
      transparent 0,
      transparent 48px,
      rgba(255,255,255,.012) 49px
    );
  pointer-events:none;
}

.hero-main:after{
  content:"RFID";
  position:absolute;
  right:-25px;
  bottom:-68px;
  font-size:190px;
  line-height:1;
  font-weight:900;
  color:rgba(57,199,255,.025);
  letter-spacing:-.08em;
}

.hero-side{
  padding:21px;
  border-radius:8px 24px 8px 24px;
}

.eyebrow{
  color:var(--cyan);
  font:9px "Space Mono",monospace;
  letter-spacing:.22em;
  margin-bottom:14px;
  position:relative;
}

.eyebrow:before{
  content:"";
  display:inline-block;
  width:24px;
  height:1px;
  margin:0 8px 3px 0;
  background:var(--cyan);
  box-shadow:0 0 9px var(--cyan);
}

.hero-title{
  max-width:820px;
  position:relative;
  font-size:clamp(32px,4vw,58px);
  line-height:.95;
  letter-spacing:-.065em;
  font-weight:900;
}

.hero-title span{
  color:var(--cyan2);
  text-shadow:0 0 28px rgba(57,199,255,.18);
}

.hero-copy{
  position:relative;
  max-width:780px;
  margin-top:17px;
  color:#73879b;
  font-size:12px;
  line-height:1.75;
}

.hero-tags{
  position:relative;
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:19px;
}

.tag{
  padding:7px 10px;
  border:1px solid #304355;
  border-radius:6px;
  color:#a9c3d7;
  background:#0b1119;
  box-shadow:3px 3px 0 #020306;
  font:8px "Space Mono",monospace;
  letter-spacing:.08em;
}

.side-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:17px;
}

.side-head strong{
  font-size:10px;
  letter-spacing:.12em;
}

.health{
  width:158px;
  height:158px;
  margin:4px auto 18px;
  border-radius:50%;
  display:grid;
  place-items:center;
  position:relative;
  background:
    conic-gradient(
      var(--green) 0 356deg,
      rgba(255,255,255,.06) 356deg 360deg
    );
  box-shadow:
    0 0 40px rgba(53,230,161,.08),
    inset 0 0 25px rgba(0,0,0,.5);
}

.health:after{
  content:"";
  position:absolute;
  inset:-8px;
  border:1px dashed rgba(139,232,255,.13);
  border-radius:50%;
  animation:spin 18s linear infinite;
}

@keyframes spin{to{transform:rotate(360deg)}}

.health:before{
  content:"";
  position:absolute;
  inset:11px;
  border-radius:50%;
  background:
    radial-gradient(circle at 40% 35%,#172331,#080c12 68%);
  border:1px solid rgba(255,255,255,.055);
}

.health-content{
  position:relative;
  z-index:2;
  text-align:center;
}

.health-value{
  font-size:32px;
  font-weight:900;
  letter-spacing:-.05em;
}

.health-label{
  margin-top:3px;
  color:#6c8093;
  font:7px "Space Mono",monospace;
  letter-spacing:.16em;
}

.health-row{
  display:flex;
  justify-content:space-between;
  padding:9px 0;
  border-top:1px solid rgba(255,255,255,.06);
  color:#6d8194;
  font:8px "Space Mono",monospace;
}

.health-row span:last-child{
  color:var(--green);
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:21px 0 10px;
}

.section-title h2{
  font-size:10px;
  letter-spacing:.15em;
  font-weight:800;
}

.section-title h2:before{
  content:"";
  display:inline-block;
  width:7px;
  height:7px;
  margin-right:8px;
  background:var(--cyan);
  box-shadow:0 0 10px rgba(57,199,255,.8);
}

.section-title span{
  color:#566b80;
  font:8px "Space Mono",monospace;
}

.live-card{
  position:relative;
  overflow:hidden;
  min-height:205px;
  padding:27px;
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  align-items:center;
  gap:24px;
  border:1px solid #273747;
  border-radius:19px;
  background:
    radial-gradient(circle at 14% 50%,rgba(57,199,255,.065),transparent 30%),
    linear-gradient(145deg,#121b26,#080c12);
  box-shadow:var(--soft);
  transition:.35s ease;
}

.live-card:before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:-40%;
  height:80px;
  background:linear-gradient(
    transparent,
    rgba(57,199,255,.09),
    transparent
  );
  animation:liveSweep 4s linear infinite;
  pointer-events:none;
}

@keyframes liveSweep{
  to{top:140%}
}

.live-card.granted{
  border-color:rgba(53,230,161,.58);
  box-shadow:var(--soft),0 0 55px rgba(53,230,161,.055);
}

.live-card.denied{
  border-color:rgba(255,77,109,.68);
  box-shadow:var(--soft),0 0 55px rgba(255,77,109,.07);
}

.rfid-orb{
  width:112px;
  height:112px;
  border-radius:50%;
  display:grid;
  place-items:center;
  position:relative;
  border:1px solid #38546a;
  background:
    radial-gradient(circle,#182c3d 0 17%,transparent 18% 25%,rgba(57,199,255,.08) 26% 28%,transparent 29% 38%,rgba(57,199,255,.06) 39% 41%,transparent 42%),
    #091019;
  box-shadow:
    inset 7px 7px 16px rgba(0,0,0,.7),
    inset -5px -5px 14px rgba(255,255,255,.025),
    0 0 34px rgba(57,199,255,.08);
  font-size:42px;
  color:var(--cyan2);
}

.rfid-orb:after{
  content:"";
  position:absolute;
  inset:8px;
  border-radius:50%;
  border:1px dashed rgba(139,232,255,.16);
  animation:spin 12s linear infinite reverse;
}

.live-kicker{
  color:#60768b;
  font:8px "Space Mono",monospace;
  letter-spacing:.19em;
  margin-bottom:8px;
}

.waiting{
  font-size:24px;
  font-weight:700;
  letter-spacing:-.035em;
}

.scan-name{
  font-size:32px;
  font-weight:900;
  letter-spacing:-.05em;
}

.scan-name.green{color:var(--green);text-shadow:0 0 25px rgba(53,230,161,.13)}
.scan-name.red{color:var(--red);text-shadow:0 0 25px rgba(255,77,109,.13)}

.uid{
  margin:6px 0 12px;
  color:#71869a;
  font:10px "Space Mono",monospace;
}

.access{
  display:inline-flex;
  padding:7px 11px;
  border-radius:6px;
  font:8px "Space Mono",monospace;
  letter-spacing:.11em;
  box-shadow:3px 3px 0 #020306;
}

.access.granted{
  color:var(--green);
  border:1px solid rgba(53,230,161,.42);
  background:rgba(53,230,161,.07);
}

.access.denied{
  color:var(--red);
  border:1px solid rgba(255,77,109,.44);
  background:rgba(255,77,109,.07);
}

.live-time{
  min-width:125px;
  text-align:right;
  color:#60768b;
  font:9px/1.8 "Space Mono",monospace;
}

.metrics{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:11px;
  margin-top:13px;
}

.metric{
  min-height:120px;
  padding:17px;
  position:relative;
  overflow:hidden;
  border:1px solid var(--edge);
  border-radius:13px;
  background:
    linear-gradient(145deg,#141c27,#090d13);
  box-shadow:var(--soft);
  transition:.25s ease;
}

.metric:hover{
  transform:translateY(-3px);
  border-color:#40566c;
}

.metric:before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:2px;
  background:var(--accent,var(--cyan));
  box-shadow:0 0 14px color-mix(in srgb,var(--accent,var(--cyan)) 50%,transparent);
}

.metric:after{
  content:"";
  position:absolute;
  width:90px;
  height:90px;
  right:-45px;
  bottom:-45px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.035);
}

.metric-top{
  display:flex;
  justify-content:space-between;
  color:#687d91;
  font:8px "Space Mono",monospace;
  letter-spacing:.13em;
}

.metric-icon{
  color:var(--accent,var(--cyan));
  font-size:15px;
}

.metric-value{
  margin-top:18px;
  font-size:32px;
  line-height:1;
  font-weight:900;
  letter-spacing:-.06em;
}

.metric-note{
  margin-top:7px;
  color:#53687b;
  font:7px "Space Mono",monospace;
}

.content-grid{
  display:grid;
  grid-template-columns:minmax(0,1.45fr) minmax(310px,.55fr);
  gap:13px;
  margin-top:13px;
}

.panel{
  overflow:hidden;
  border:1px solid var(--edge);
  border-radius:16px;
  background:#0b1017;
  box-shadow:var(--soft);
}

.panel-head{
  min-height:57px;
  padding:14px 17px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  border-bottom:1px solid rgba(255,255,255,.055);
  background:linear-gradient(180deg,#111923,#0b1017);
}

.panel-head strong{
  font-size:10px;
  letter-spacing:.1em;
}

.panel-head span{
  color:#5e7286;
  font:8px "Space Mono",monospace;
}

.clear{
  color:#71869a;
  background:#0b1118;
  border:1px solid #2b3b4c;
  border-radius:6px;
  padding:6px 9px;
  cursor:pointer;
  font:8px "Space Mono",monospace;
  box-shadow:3px 3px 0 #020306;
  transition:.15s;
}

.clear:hover{
  color:var(--cyan2);
  border-color:#3e6179;
  transform:translate(2px,2px);
  box-shadow:1px 1px 0 #020306;
}

.history{
  max-height:470px;
  overflow:auto;
}

.history::-webkit-scrollbar{width:4px}
.history::-webkit-scrollbar-thumb{background:#29394a;border-radius:8px}

.row{
  display:grid;
  grid-template-columns:8px minmax(0,1fr) 110px 110px;
  gap:13px;
  align-items:center;
  padding:14px 17px;
  border-bottom:1px solid rgba(148,163,184,.055);
  transition:.18s;
}

.row:hover{
  background:
    linear-gradient(90deg,rgba(57,199,255,.05),transparent 70%);
}

.row-dot{
  width:7px;
  height:7px;
  border-radius:50%;
}

.row-dot.g{
  background:var(--green);
  box-shadow:0 0 11px rgba(53,230,161,.75);
}

.row-dot.r{
  background:var(--red);
  box-shadow:0 0 11px rgba(255,77,109,.65);
}

.row-name{
  font-size:12px;
  font-weight:800;
}

.row-uid{
  margin-top:4px;
  color:#5e7286;
  font:8px "Space Mono",monospace;
}

.row-access{
  font:8px "Space Mono",monospace;
  font-weight:800;
}

.row-access.g{color:var(--green)}
.row-access.r{color:var(--red)}

.row-time{
  text-align:right;
  color:#5e7286;
  font:8px/1.7 "Space Mono",monospace;
}

.empty{
  padding:58px 20px;
  text-align:center;
  color:#566b7e;
  font:9px/1.9 "Space Mono",monospace;
}

.users{
  padding:4px 0;
}

.user{
  display:grid;
  grid-template-columns:43px minmax(0,1fr) auto;
  gap:11px;
  align-items:center;
  padding:12px 15px;
  border-bottom:1px solid rgba(148,163,184,.055);
  cursor:pointer;
  transition:.18s;
}

.user:hover{
  background:rgba(57,199,255,.035);
  padding-left:18px;
}

.avatar{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  border-radius:10px;
  color:var(--cyan2);
  font-size:10px;
  font-weight:900;
  background:linear-gradient(145deg,#1a2735,#090d13);
  border:1px solid #33485b;
  box-shadow:
    inset 3px 3px 7px rgba(255,255,255,.025),
    inset -4px -4px 8px rgba(0,0,0,.6);
}

.user-name{
  font-size:11px;
  font-weight:800;
}

.user-uid{
  margin-top:4px;
  color:#5b7084;
  font:7px "Space Mono",monospace;
}

.user-count{
  text-align:right;
}

.user-count b{
  color:var(--cyan2);
  font-size:16px;
}

.user-count small{
  display:block;
  color:#53687b;
  font:7px "Space Mono",monospace;
}

.architecture{
  position:relative;
  overflow:hidden;
  margin-top:14px;
  padding:18px;
  border:1px solid var(--edge);
  border-radius:17px;
  background:
    radial-gradient(circle at 50% 0,rgba(57,199,255,.065),transparent 50%),
    #0a0f16;
  box-shadow:var(--soft);
}

.architecture:before{
  content:"SYSTEM DATA BUS";
  position:absolute;
  right:17px;
  top:15px;
  color:#33475a;
  font:7px "Space Mono",monospace;
  letter-spacing:.14em;
}

.arch-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin-top:12px;
}

.arch{
  min-height:98px;
  padding:13px;
  border:1px solid #29394a;
  border-radius:9px;
  background:linear-gradient(145deg,#121a24,#090d13);
  box-shadow:4px 4px 0 #020306;
}

.arch b{
  color:#b6d1e3;
  font-size:9px;
}

.arch p{
  margin-top:7px;
  color:#5d7185;
  font:7px/1.65 "Space Mono",monospace;
}

.connector{
  margin:14px 0 1px;
  color:var(--cyan);
  text-align:center;
  font:8px "Space Mono",monospace;
  letter-spacing:.06em;
}

.footer{
  display:flex;
  justify-content:space-between;
  gap:15px;
  flex-wrap:wrap;
  margin-top:20px;
  padding:15px 3px;
  color:#4f6377;
  font:8px "Space Mono",monospace;
  letter-spacing:.07em;
}

.footer strong{
  color:var(--green);
  text-shadow:0 0 10px rgba(53,230,161,.18);
}

@media(max-width:1050px){
  .hero{grid-template-columns:1fr}
  .metrics{grid-template-columns:repeat(2,1fr)}
  .content-grid{grid-template-columns:1fr}
}

@media(max-width:760px){
  .shell{width:min(100% - 20px,1480px)}
  .topbar{align-items:flex-start;flex-direction:column}
  .top-actions{justify-content:flex-start}
  .live-card{grid-template-columns:1fr;text-align:left}
  .live-time{text-align:left}
  .arch-grid{grid-template-columns:1fr 1fr}
}

@media(max-width:500px){

<script>
/*
  IMPORTANT:
  The existing RFID WebSocket endpoint is intentionally unchanged.
*/
const RFID_WS_URL = "wss://nacho-plunder-oblivion.ngrok-free.dev";

const USERS = [
  {name:"Gagan",uid:"F3C996F5",initials:"GG"},
  {name:"Priyanshu",uid:"B302 90FC",initials:"PR"},
  {name:"Vaibhav",uid:"3D94BCD",initials:"VB"},
  {name:"Ashwith",uid:"E3A735CD",initials:"AS"},
  {name:"Arpit",uid:"F3C0C7DC",initials:"MY"}
];

let stats={total:0,granted:0,denied:0};
let history=[];
let userScanCounts={};
let reconnectTimer=null;

USERS.forEach(u=>userScanCounts[u.name]=0);

function renderUsers(){
  document.getElementById("usersList").innerHTML=USERS.map(u=>`
    <div class="user">
      <div class="avatar">${u.initials}</div>
      <div>
        <div class="user-name">${u.name}</div>
        <div class="user-uid">${u.uid}</div>
      </div>
      <div class="user-count">
        <b id="count-${u.name}">${userScanCounts[u.name]}</b>
        <small>SCANS</small>
      </div>
    </div>
  `).join("");
}

function updateLiveCard(data){
  const granted=data.access==="GRANTED";
  const card=document.getElementById("liveCard");
  const icon=document.getElementById("liveIcon");
  const wait=document.getElementById("waitText");
  const content=document.getElementById("liveContent");
  const name=document.getElementById("liveName");
  const uid=document.getElementById("liveUID");
  const badge=document.getElementById("liveBadge");
  const time=document.getElementById("liveTime");

  card.className="live-card "+(granted?"granted":"denied");
  icon.textContent=granted?"✓":"×";
  wait.style.display="none";
  content.style.display="block";
  name.textContent=data.name||"Unknown";
  name.className="scan-name "+(granted?"green":"red");
  uid.textContent="UID: "+(data.uid||"—");

  badge.innerHTML=`<span class="access ${granted?"granted":"denied"}">${granted?"● ACCESS GRANTED":"× ACCESS DENIED"}</span>`;
  time.innerHTML=`<div>${data.date||""}</div><strong style="color:var(--text);font-size:15px">${data.timestamp||""}</strong>`;

  const line=document.createElement("div");
  line.style.cssText="position:absolute;left:0;right:0;top:35%;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);box-shadow:0 0 16px var(--cyan);animation:scanLine .7s ease forwards";
  card.appendChild(line);
  setTimeout(()=>line.remove(),800);

  clearTimeout(updateLiveCard.reset);
  updateLiveCard.reset=setTimeout(()=>{
    card.className="live-card";
    icon.textContent="⌁";
    wait.style.display="block";
    content.style.display="none";
    time.innerHTML="";
  },5000);
}

const style=document.createElement("style");
style.textContent="@keyframes scanLine{from{transform:scaleX(.1);opacity:0}40%{opacity:1}to{transform:scaleX(1);opacity:0}}";
document.head.appendChild(style);

function addToHistory(data){
  history.unshift(data);
  if(history.length>50)history.pop();

  const list=document.getElementById("historyList");
  if(list.querySelector(".empty"))list.innerHTML="";

  const granted=data.access==="GRANTED";
  const item=document.createElement("div");
  item.className="row";
  item.innerHTML=`
    <span class="row-dot ${granted?"g":"r"}"></span>
    <div><div class="row-name">${data.name||"Unknown"}</div><div class="row-uid">${data.uid||"—"}</div></div>
    <div class="row-access ${granted?"g":"r"}">${data.access||"UNKNOWN"}</div>
    <div class="row-time">${data.date||""}<br>${data.timestamp||""}</div>
  `;
  list.insertBefore(item,list.firstChild);
  if(list.children.length>20)list.removeChild(list.lastChild);
  document.getElementById("historyCount").textContent=history.length+" EVENTS";
}

async function sendJarvisAlert(
    project,
    title,
    message,
    severity = "warning"
) {

    try {

        const response = await fetch(
            "http://localhost:5000/send-alert",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    project: project,

                    title: title,

                    message: message,

                    severity: severity

                })
            }
        );

        const result = await response.json();

        console.log(
            "🚨 Jarvis alert sent:",
            result
        );

    } catch (error) {

        console.error(
            "❌ Could not send Jarvis alert:",
            error
        );
    }
}
  
function updateStats(data){
  stats.total++;
  if(data.access==="GRANTED")stats.granted++;
  else stats.denied++;

  document.getElementById("totalScans").textContent=stats.total;
  document.getElementById("totalGranted").textContent=stats.granted;
  document.getElementById("totalDenied").textContent=stats.denied;
  document.getElementById("lastScanTime").textContent=data.timestamp||"—";

  if(userScanCounts[data.name]!==undefined){
    userScanCounts[data.name]++;
    const el=document.getElementById("count-"+data.name);
    if(el)el.textContent=userScanCounts[data.name];
  }
}

function clearHistory(){
  history=[];
  stats={total:0,granted:0,denied:0};
  USERS.forEach(u=>userScanCounts[u.name]=0);

  document.getElementById("historyList").innerHTML='<div class="empty">NO EVENTS YET<br><br>PLACE AN RFID CARD ON THE RC522 READER</div>';
  document.getElementById("historyCount").textContent="0 EVENTS";
  document.getElementById("totalScans").textContent="0";
  document.getElementById("totalGranted").textContent="0";
  document.getElementById("totalDenied").textContent="0";
  document.getElementById("lastScanTime").textContent="—";
  renderUsers();
}

function handleScan(data){
  updateLiveCard(data);
  addToHistory(data);
  updateStats(data);
}

function setConnection(online,label){
  const dot=document.getElementById("wsDot");
  dot.className="dot"+(online?" live":"");
  document.getElementById("wsLabel").textContent=label;
  document.getElementById("healthWs").textContent=online?"CONNECTED":"RECONNECTING";
}

function connect(){
  try{
    const ws=new WebSocket(RFID_WS_URL);

    ws.onopen=()=>{
      setConnection(true,"LIVE / CONNECTED");
    };

    ws.onmessage=e=>{
      try{
        const data=JSON.parse(e.data);

        // Preserve original behavior: ignore aggregate user messages.
        if(data.type==="users")return;

        if(data.project==="rfid"){
          handleScan(data);
        }
      }catch(err){
        console.error("RFID event parse error:",err);
      }
    };

    ws.onclose=()=>{
      setConnection(false,"DISCONNECTED / RETRYING");
      clearTimeout(reconnectTimer);
      reconnectTimer=setTimeout(connect,3000);
    };

    ws.onerror=()=>{
      setConnection(false,"CONNECTION ERROR");
      ws.close();
    };
  }catch(err){
    setConnection(false,"CONNECTION ERROR");
    reconnectTimer=setTimeout(connect,3000);
  }
}

function tick(){
  const t=new Date().toLocaleTimeString("en-IN",{hour12:false});
  document.getElementById("clock").textContent=t;
  document.getElementById("footerTime").textContent=t;
}
setInterval(tick,1000);
tick();
renderUsers();
connect();
