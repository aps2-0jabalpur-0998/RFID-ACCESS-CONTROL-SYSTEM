name: GuardianEye Telegram Sync

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Prevent two scheduled/manual sync runs from pushing at the same time.
concurrency:
  group: guardianeye-telegram-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Telethon
        run: pip install telethon

      - name: Read Telegram and update alerts.json
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python .github/scripts/telegram_sync.py

      - name: Commit alert feed
        run: |
          set -e

          git config user.name "GuardianEye Bot"
          git config user.email "actions@users.noreply.github.com"

          # Save the files generated by the Telegram sync. We will copy them
          # back after refreshing main so a concurrent repository commit does
          # not cause a non-fast-forward push failure.
          cp alerts.json /tmp/guardianeye-alerts.json
          cp telegram_offset.txt /tmp/guardianeye-offset.txt

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}..."

            git fetch origin main
            git reset --hard origin/main

            cp /tmp/guardianeye-alerts.json alerts.json
            cp /tmp/guardianeye-offset.txt telegram_offset.txt

            git add alerts.json telegram_offset.txt

            if git diff --cached --quiet; then
              echo "No alert-feed change."
              exit 0
            fi

            git commit -m "Update GuardianEye alert feed"

            if git push origin HEAD:main; then
              echo "GuardianEye alert feed pushed successfully."
              exit 0
            fi

            echo "Push rejected; refreshing main before retry..."
            git reset --hard origin/main
            sleep 2
          done

          echo "Unable to push GuardianEye alert feed after 3 attempts."
          exit 1
