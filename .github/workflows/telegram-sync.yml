name: GuardianEye Telegram Sync

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Telethon
        run: pip install telethon

      - name: Read Telegram and update alerts.json
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python .github/scripts/telegram_sync.py

      - name: Commit alert feed
        run: |
          git config user.name "GuardianEye Bot"
          git config user.email "actions@users.noreply.github.com"

          git add alerts.json telegram_offset.txt

          if git diff --cached --quiet; then
            echo "No alert-feed change."
            exit 0
          fi

          git commit -m "Update GuardianEye alert feed"
          git push
